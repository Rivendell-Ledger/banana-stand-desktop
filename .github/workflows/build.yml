name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  windows:
    name: Windows installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-desktop.txt -r requirements-build.txt

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "0.0.0-dev"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Release tags must look like v1.2.3 (got '$version')"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Build the application
        run: python -m PyInstaller --noconfirm --clean BananaStand.spec

      - name: Build KitDoctor
        run: python -m PyInstaller --noconfirm --onefile --name KitDoctor --distpath dist/BananaStand --workpath build/kitdoctor --specpath build kit_doctor.py

      - name: Check the build output
        shell: pwsh
        run: |
          $required = @(
            "dist/BananaStand/BananaStand.exe",
            "dist/BananaStand/KitDoctor.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing build output: $path" }
          }
          Get-ChildItem dist/BananaStand | Select-Object Name, Length | Format-Table

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" BananaStand.iss
          if (-not (Test-Path "dist/BananaStandSetup.exe")) { throw "Installer was not produced" }
          Move-Item dist/BananaStandSetup.exe "dist/BananaStandSetup-${{ steps.version.outputs.version }}.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: BananaStandSetup-${{ steps.version.outputs.version }}
          path: dist/BananaStandSetup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to a draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          gh release create $tag "dist/BananaStandSetup-$version.exe" `
            --draft `
            --title "The Banana Stand $version" `
            --notes "Windows installer for The Banana Stand $version. Review these notes and publish the release when you are ready."
